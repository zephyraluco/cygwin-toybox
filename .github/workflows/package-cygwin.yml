name: Package minimal Cygwin

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - scripts/**
      - .gitattributes
      - .github/workflows/package-cygwin.yml
  pull_request:
    paths:
      - scripts/**
      - .gitattributes
      - .github/workflows/package-cygwin.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Preserve upstream Unix line endings
        run: git config --global core.autocrlf false
      - name: Check out pinned Toybox source
        uses: actions/checkout@v4
        with:
          repository: landley/toybox
          ref: a57b091d05ec366dcd4dd737784c03761cb6a4b1
          path: upstream/toybox
      - name: Install isolated Cygwin compiler
        run: |
          ./scripts/install-cygwin.ps1 -Root C:\cygwin-build -AdditionalPackages 'gcc-core,gcc-g++,make,patch,xorg-server,libX11-devel,libGL-devel,dri-drivers,cygport,meson,ninja,python3,bison,flex,pkg-config,libexpat-devel,zlib-devel,libXext-devel,libXfixes-devel,libXdamage-devel,libXxf86vm-devel,libxcb-devel,libX11-xcb-devel,libxcb-dri2-devel,libxcb-dri3-devel,libxcb-glx-devel,libxcb-present-devel,libxcb-randr-devel,libxcb-shm-devel,libxcb-xfixes-devel,libzstd-devel,xorgproto,windowsdriproto,curl'
          $pythonTag = & C:\cygwin-build\bin\python3.exe -c 'import sys; print(str(sys.version_info.major) + str(sys.version_info.minor))'
          if ($LASTEXITCODE -ne 0 -or $pythonTag -notmatch '^3[0-9]+$') { throw 'Cannot determine Cygwin Python version' }
          ./scripts/install-cygwin.ps1 -Root C:\cygwin-build -AdditionalPackages "python${pythonTag}-mako,python${pythonTag}-packaging,python${pythonTag}-ply,python${pythonTag}-pefile"
          & C:\cygwin-build\bin\python3.exe -c 'import sys, mako, packaging, ply, pefile; print(sys.version); print("Mesa Python dependencies ready")'
          if ($LASTEXITCODE -ne 0) { throw 'Missing Mesa Python dependencies' }
      - name: Build Cygwin Mesa without LLVM
        run: |
          $script = & C:\cygwin-build\bin\cygpath.exe -u "$env:GITHUB_WORKSPACE/scripts/build-mesa-softpipe.sh"
          & C:\cygwin-build\bin\bash.exe --login $script "$env:TEMP/cygwin-packages"
          if ($LASTEXITCODE -ne 0) { throw 'Non-LLVM Mesa build failed' }
      - name: Install and validate Cygwin
        run: ./scripts/install-cygwin.ps1 -Root C:\cygwin
      - name: Compile and integrate Toybox
        run: |
          $script = 'C:/cygwin-build/bin/cygpath.exe'
          $buildScript = & $script -u "$env:GITHUB_WORKSPACE/scripts/build-toybox.sh"
          & C:\cygwin-build\bin\bash.exe --login $buildScript "$env:GITHUB_WORKSPACE/upstream/toybox" C:\cygwin
          if ($LASTEXITCODE -ne 0) { throw 'Toybox build failed' }
      - name: Integrate minimal XWin runtime
        run: |
          $script = & C:\cygwin-build\bin\cygpath.exe -u "$env:GITHUB_WORKSPACE/scripts/integrate-xwin.sh"
          & C:\cygwin-build\bin\bash.exe --login $script C:\cygwin "$env:RUNNER_TEMP/xwin-smoke.exe"
          if ($LASTEXITCODE -ne 0) { throw 'XWin integration failed' }
      - name: Validate XWin and indirect GLX rendering
        timeout-minutes: 3
        run: |
          $script = & C:\cygwin\bin\cygpath.exe -u "$env:GITHUB_WORKSPACE/scripts/test-xwin.sh"
          & C:\cygwin\bin\bash.exe --login $script "$env:RUNNER_TEMP/xwin-smoke.exe"
          if ($LASTEXITCODE -ne 0) { throw 'XWin functional tests failed' }
      - name: Validate Toybox in runtime without compiler
        run: |
          $testScript = & C:\cygwin\bin\cygpath.exe -u "$env:GITHUB_WORKSPACE/scripts/test-toybox.sh"
          & C:\cygwin\bin\bash.exe --login $testScript
          if ($LASTEXITCODE -ne 0) { throw 'Toybox runtime tests failed' }
      - name: Clean published runtime
        run: |
          $script = & C:\cygwin\bin\cygpath.exe -u "$env:GITHUB_WORKSPACE/scripts/prune-docs.sh"
          & C:\cygwin\bin\bash.exe --login $script
          if ($LASTEXITCODE -ne 0) { throw 'Runtime cleanup failed' }
      - name: Archive installed environment
        run: |
          # Use a known tar implementation which understands Cygwin files.
          # Invoke it directly so a login shell cannot recreate runneradmin's home.
          $env:PATH = "C:\cygwin\bin;$env:PATH"
          $archive = & C:\cygwin\bin\cygpath.exe -u "$env:RUNNER_TEMP/cygwin-x86_64.tar.gz"
          & C:\cygwin\bin\tar.exe --version
          & C:\cygwin\bin\tar.exe -czf $archive -C /cygdrive/c cygwin
          if ($LASTEXITCODE -ne 0) { throw "Cygwin archive creation failed: $LASTEXITCODE" }
          & C:\cygwin\bin\tar.exe -tzf $archive > "$env:RUNNER_TEMP/cygwin-archive-files.txt"
          if ($LASTEXITCODE -ne 0) { throw "Cygwin archive validation failed: $LASTEXITCODE" }
      - name: Upload Cygwin archive
        uses: actions/upload-artifact@v4
        with:
          name: cygwin-x86_64
          path: ${{ runner.temp }}/cygwin-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested archive
        uses: actions/download-artifact@v4
        with:
          name: cygwin-x86_64
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum cygwin-x86_64.tar.gz > cygwin-x86_64.tar.gz.sha256
          cat > release-notes.md <<'EOF'
          Cygwin environment with Toybox 0.8.15, XWin, Mesa software GLX, OpenSSH and xauth.

          Download cygwin-x86_64.tar.gz directly and extract on Windows. The SHA-256 checksum is provided alongside it.

          Documentation, Info and man manuals are removed. /usr/share/locale contains only locale.alias; X11 locale and keyboard data are retained. The CI runner's /home/runneradmin directory is removed. Start XWin with +iglx -nowgl to enable indirect software GLX.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" cygwin-x86_64.tar.gz cygwin-x86_64.tar.gz.sha256 --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md --draft=false
          else
            gh release create "$RELEASE_TAG" cygwin-x86_64.tar.gz cygwin-x86_64.tar.gz.sha256 --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
