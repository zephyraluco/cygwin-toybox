name: Package minimal Cygwin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .gitattributes
      - .github/workflows/package-cygwin.yml
  pull_request:
    paths:
      - scripts/**
      - .gitattributes
      - .github/workflows/package-cygwin.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Preserve upstream Unix line endings
        run: git config --global core.autocrlf false
      - name: Check out pinned Toybox source
        uses: actions/checkout@v4
        with:
          repository: landley/toybox
          ref: a57b091d05ec366dcd4dd737784c03761cb6a4b1
          path: upstream/toybox
      - name: Install isolated Cygwin compiler
        run: ./scripts/install-cygwin.ps1 -Root C:\cygwin-build -AdditionalPackages 'gcc-core,make,patch'
      - name: Install and validate Cygwin
        run: ./scripts/install-cygwin.ps1 -Root C:\cygwin
      - name: Compile and integrate Toybox
        run: |
          $script = 'C:/cygwin-build/bin/cygpath.exe'
          $buildScript = & $script -u "$env:GITHUB_WORKSPACE/scripts/build-toybox.sh"
          & C:\cygwin-build\bin\bash.exe --login $buildScript "$env:GITHUB_WORKSPACE/upstream/toybox" C:\cygwin
          if ($LASTEXITCODE -ne 0) { throw 'Toybox build failed' }
      - name: Validate Toybox in runtime without compiler
        run: |
          $testScript = & C:\cygwin\bin\cygpath.exe -u "$env:GITHUB_WORKSPACE/scripts/test-toybox.sh"
          & C:\cygwin\bin\bash.exe --login $testScript
          if ($LASTEXITCODE -ne 0) { throw 'Toybox runtime tests failed' }
      - name: Archive installed environment
        run: |
          # tar preserves Cygwin links and metadata better than a ZIP archive.
          tar.exe -czf "$env:RUNNER_TEMP/cygwin-x86_64.tar.gz" -C C:\ cygwin
          if ($LASTEXITCODE -ne 0) { throw 'Cygwin archive creation failed' }
          tar.exe -tzf "$env:RUNNER_TEMP/cygwin-x86_64.tar.gz" > "$env:RUNNER_TEMP/cygwin-archive-files.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Cygwin archive validation failed' }
      - name: Upload Cygwin archive
        uses: actions/upload-artifact@v4
        with:
          name: cygwin-x86_64
          path: ${{ runner.temp }}/cygwin-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
